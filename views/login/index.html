<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure RSVP Gateway</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/login/style.css">
</head>

<body>

    <main class="auth-container">
        <div class="glass-card">

            <div class="auth-header">
                <h2 id="auth-title">Secure Portal Sign In</h2>
                <p class="auth-subtitle">RSVP & Event Management Platform</p>
            </div>

            <!-- Real-time Error Notification Element -->
            <div id="auth-error-message" class="error-banner" style="display: none;"></div>

            <form id="auth-form" autocomplete="off">

                <!-- Username Input Field -->
                <div class="input-group">
                    <label for="auth-username">Username</label>
                    <input type="text" id="auth-username" name="username" placeholder="Enter your username" required
                        minlength="3" maxlength="30">
                </div>

                <!-- Password Input Field -->
                <div class="input-group">
                    <label for="auth-password">Password</label>
                    <input type="password" id="auth-password" name="password" placeholder="••••••••" required>
                </div>

                <!-- Role Selector Field -->
                <div class="input-group">
                    <label for="auth-role">Account Role</label>
                    <select id="auth-role" name="role" required>
                        <option value="attendee" selected>Attendee (Join Events)</option>
                        <option value="organizer">Organizer (Host Events)</option>
                    </select>
                </div>

                <!-- Dynamic Invite Code Field (Hidden by default, shown via script.js during Organizer Signup) -->
                <div class="input-group" id="invite-code-container" style="display: none;">
                    <label for="auth-invite-code">Organizer Invite Token</label>
                    <input type="text" id="auth-invite-code" name="inviteCode" placeholder="ORG-XXXX-XXXX">
                </div>

                <!-- Submit Button -->
                <button type="submit" id="auth-submit-btn" class="submit-btn">
                    Authenticate
                </button>

            </form>

            <!-- View State Toggle Link -->
            <div class="auth-footer">
                <a href="#" id="toggle-auth-mode">Don't have an account? Sign Up</a>
            </div>

        </div>
    </main>

    <!-- Connect script handling JSON API dispatches -->
    <script src="/login/script.js"></script>
</body>

</html>
