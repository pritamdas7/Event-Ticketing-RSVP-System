<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Ticketing & RSVP System</title>
    <link rel="stylesheet" href="/event/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="/event/script.js" defer></script>
</head>

<body>
    <div class="container">
        <header class="top-header">
            <h1 id="eventTitle">Loading Event...</h1>
            <p>Secure your spot and receive your QR Entry Ticket.</p>
        </header>
        <main class="content-area">
            <form class="rsvp-form">
                <div class="section-title">Step 1: Choose Ticket Tier</div>
                <div class="input-box radio-group row-group">
                    <div>
                        <input type="radio" id="vip" name="tier" value="vip">
                        <label for="vip" class="inline-label">VIP Access</label>
                    </div>
                    <div>
                        <input type="radio" id="general" name="tier" value="general" checked>
                        <label for="general" class="inline-label">General Admission</label>
                    </div>
                    <div>
                        <input type="radio" id="waitlist" name="tier" value="waitlist">
                        <label for="waitlist" class="inline-label">Join Waitlist</label>
                    </div>
                </div>

                <div class="section-title">Step 2: Seat Selection</div>
                <p class="helper-text" id="seatHelper">Select your preferred seats from the interactive map.</p>

                <div class="seat-map" id="seatMap"></div>

                <div class="section-title">Step 3: Attendee Details</div>
                <div class="input-box">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>
                <div class="input-box">
                    <label for="email">Email Address (For QR Ticket Delivery)</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="section-title">Step 4: Payment & Checkout</div>
                <div class="payment-info">
                    <p>Secure payment processing via Stripe Connect.</p>
                </div>
                <button type="button" class="submit-button">Proceed to Secure Checkout</button>
            </form>
        </main>
    </div>
</body>

</html>
